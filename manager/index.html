<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NLE Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>NLE Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* Layout : app mobile-first — en-tête marine, contenu en cartes, barre d'onglets en bas (iPhone) / en haut (PC). Palette tirée du logo No Limit Events. */
:root{
  --bg:#EEF4FB; --surface:#FFFFFF; --surface-2:#F5F9FD; --ink:#16264A; --muted:#5A6A8A; --line:#DCE6F2;
  --head:#132A5C; --head-2:#1D3B7E; --on-head:#FFFFFF;
  --navy:#132A5C; --sky:#1F8FE0; --sky-soft:#E3F1FD; --pink:#E62E74; --pink-soft:#FDE8F0;
  --lime:#5FA318; --lime-soft:#E8F5D6; --amber:#B97806; --amber-soft:#FFF1D2; --red:#D92D4B; --red-soft:#FDE6EA;
  --violet:#6B46C1; --violet-soft:#EEE9FB; --shadow:0 2px 10px rgba(19,42,92,.07);
  --font-d:'Baloo 2',ui-rounded,system-ui,sans-serif; --font-b:'Nunito',system-ui,-apple-system,sans-serif;
  --r:16px; --r-s:11px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1530; --surface:#132140; --surface-2:#18294D; --ink:#E7EEFA; --muted:#9AAACB; --line:#26385E;
  --head:#0A1430; --head-2:#13285A; --on-head:#FFFFFF;
  --navy:#BFD6FF; --sky:#62B8F7; --sky-soft:#16345A; --pink:#FF6B9F; --pink-soft:#3A1B2E;
  --lime:#97D752; --lime-soft:#1F3418; --amber:#F2B544; --amber-soft:#3A2C10; --red:#FF7088; --red-soft:#3D1820;
  --violet:#B39BF5; --violet-soft:#29204A; --shadow:0 2px 12px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1530; --surface:#132140; --surface-2:#18294D; --ink:#E7EEFA; --muted:#9AAACB; --line:#26385E;
  --head:#0A1430; --head-2:#13285A; --on-head:#FFFFFF;
  --navy:#BFD6FF; --sky:#62B8F7; --sky-soft:#16345A; --pink:#FF6B9F; --pink-soft:#3A1B2E;
  --lime:#97D752; --lime-soft:#1F3418; --amber:#F2B544; --amber-soft:#3A2C10; --red:#FF7088; --red-soft:#3D1820;
  --violet:#B39BF5; --violet-soft:#29204A; --shadow:0 2px 12px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--font-b);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--head)}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);width:100%;border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:var(--surface);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 22%,transparent)}
input[type=checkbox]{width:auto}
input:disabled{background:var(--surface-2);color:var(--muted)}
textarea{resize:vertical}
label.l{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 4px 2px;text-transform:uppercase;letter-spacing:.05em}
.num,.tab-n{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Connexion ---------- */
#login{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--head) 0%,var(--head-2) 60%,#2B5BB0 100%);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lg-card{width:100%;max-width:380px;background:var(--surface);border-radius:24px;padding:22px 22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:14px}
.lg-card img{width:132px;height:132px;margin:-4px auto 0;display:block}
.lg-card h1{font-size:22px;text-align:center;color:var(--navy)}
.lg-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-top:-8px}
.lg-users{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg-users button{border:1.5px solid var(--line);border-radius:14px;padding:10px;font-weight:800;color:var(--navy);background:var(--surface-2)}
.lg-users button.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.lg-err{color:var(--red);font-weight:700;font-size:13.5px;min-height:1em;text-align:center}
.lg-keep{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);font-weight:700}
.lg-keep input{width:20px;height:20px}

/* ---------- Coque ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:linear-gradient(135deg,var(--head) 0%,var(--head-2) 100%);color:var(--on-head);box-shadow:0 4px 18px rgba(10,20,48,.3)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.brand{font-family:var(--font-d);font-weight:800;font-size:18px;line-height:1}
.brand small{display:block;font-family:var(--font-b);font-weight:700;font-size:10.5px;opacity:.7;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.who{font-size:13px;font-weight:800;background:rgba(255,255,255,.13);padding:6px 11px;border-radius:20px;white-space:nowrap}
.sync{width:9px;height:9px;border-radius:50%;background:#9AF06B;box-shadow:0 0 0 3px rgba(154,240,107,.25)}
.sync.local{background:#FFC24B;box-shadow:0 0 0 3px rgba(255,194,75,.25)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:var(--on-head);font-size:17px}
nav.tabs{display:none}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barre du bas (mobile) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(19,42,92,.12);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:800;color:var(--muted);position:relative}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--pink)}
nav.bottom .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;line-height:17px;padding:0 4px}
@media (min-width:900px){
  nav.bottom{display:none}
  nav.tabs{display:block;background:transparent}
  nav.tabs .in{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  nav.tabs button{color:rgba(255,255,255,.7);font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px 12px 0 0;position:relative}
  nav.tabs button.on{background:var(--bg);color:var(--navy)}
  nav.tabs .dot{background:var(--pink);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 7px;margin-left:6px}
  main{padding-bottom:40px}
}

/* ---------- Éléments communs ---------- */
.pg-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pg-h h1{font-size:25px;color:var(--navy);font-weight:800}
.pg-h .sub{color:var(--muted);font-size:13.5px;font-weight:600}
.pg-h .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.card-p{padding:14px 16px}
.sec{margin-bottom:14px}
.sec-t{display:flex;align-items:center;gap:8px;margin:0 0 8px 2px}
.sec-t h2{font-size:17px;color:var(--navy);font-weight:800}
.sec-t .meta{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:620px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.span2{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14.5px;padding:12px 18px;border-radius:14px;transition:transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-p{background:var(--pink);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--pink) 35%,transparent)}
.btn-g{background:var(--lime);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--lime) 35%,transparent)}
.btn-n{background:var(--head);color:#fff}
.btn-o{background:var(--surface);color:var(--navy);border:1.5px solid var(--line)}
.btn-d{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-blk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.p-grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-sky{background:var(--sky-soft);color:var(--sky)}
.p-lime{background:var(--lime-soft);color:var(--lime)}
.p-pink{background:var(--pink-soft);color:var(--pink)}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)}
.p-violet{background:var(--violet-soft);color:var(--violet)}
.empty{text-align:center;color:var(--muted);padding:34px 18px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.bar{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--lime);border-radius:5px}
.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--red)}
.tbl-w{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
table.tb .r{text-align:right}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:var(--surface-2)}
.pos{color:var(--lime)}.neg{color:var(--red)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{font-family:var(--font-d);font-size:22px;color:var(--navy);display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}

/* Alertes */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--amber);cursor:pointer}
.alert.crit{border-left-color:var(--red)}.alert.info{border-left-color:var(--sky)}
.alert .t{font-weight:800}
.alert .d{font-size:13px;color:var(--muted)}
.alert .go{margin-left:auto;color:var(--muted);font-weight:800;align-self:center}

/* Liste dossiers */
.dl{display:grid;gap:10px}
.drow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);cursor:pointer;display:grid;gap:7px}
.drow:hover{border-color:color-mix(in srgb,var(--sky) 50%,var(--line))}
.drow .a{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drow .n{font-family:var(--font-d);font-weight:800;color:var(--navy)}
.drow .c{font-weight:800;flex:1;min-width:120px}
.drow .m{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.drow .m b{color:var(--ink)}
.drow .prog{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.drow .prog span{display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:20px;font-weight:800;font-size:13px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted)}
.chip.on{background:var(--head);border-color:var(--head);color:#fff}
.search{flex:1;min-width:180px}

/* Dossier */
.dh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.dh .back{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:var(--navy)}
.dh .tt{flex:1;min-width:0}
.dh h1{font-size:22px;color:var(--navy);overflow-wrap:anywhere}
.dh .tt .row{margin-top:4px}
.dtabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex-shrink:0;padding:9px 14px;border-radius:12px;font-weight:800;font-size:13.5px;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.dtabs button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.dtabs .b{font-size:10.5px;border-radius:9px;padding:0 6px;background:var(--red-soft);color:var(--red)}
.dtabs button.on .b{background:rgba(255,255,255,.25);color:#fff}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.fs > h3{font-size:16px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fs > h3 .r{margin-left:auto;font-family:var(--font-b);font-size:12.5px;color:var(--muted);font-weight:700}
.fs.internal{border:1.5px dashed var(--pink);background:color-mix(in srgb,var(--pink-soft) 45%,var(--surface))}
.tagint{font-size:10px;font-weight:800;background:var(--pink);color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.06em}
.seg{display:flex;background:var(--sky-soft);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13px;color:var(--navy);opacity:.7}
.seg button.on{background:var(--surface);opacity:1;box-shadow:0 1px 5px rgba(19,42,92,.15)}
.lock{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13.5px;margin-bottom:12px}

/* Options devis */
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) 62px 86px 66px 92px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:none}
.opt input{padding:8px;text-align:right;font-size:15px}
.opt .on{font-weight:700;overflow-wrap:anywhere}
.opt .tt{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.opt-h{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 0 4px;border-bottom:1.5px solid var(--line)}
.opt-h span:nth-child(n+3){text-align:right}
.opt .mini small{display:none}
@media(max-width:560px){
  .opt{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-areas:"sw nm nm nm tt tt" "q q pu pu rm rm";row-gap:6px}
  .opt > .sw{grid-area:sw}.opt > .on{grid-area:nm}.opt > .tt{grid-area:tt}
  .opt > .mq{grid-area:q}.opt > .mpu{grid-area:pu}.opt > .mrm{grid-area:rm}
  .opt-h{display:none}
  .opt .mini{display:flex;flex-direction:column;gap:2px;min-width:0}
  .opt .mini small{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
}
.sw{position:relative;width:44px;height:26px;flex-shrink:0;display:inline-block}
.sw input{opacity:0;width:100%;height:100%;position:absolute;z-index:2;cursor:pointer;margin:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.18s}
.sw i:before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--lime)}
.sw input:checked+i:before{left:21px}

/* Totaux devis */
.totbox{background:var(--head);color:#fff;border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.totbox .l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.totbox .l.rem{color:#FFB0CB}
.totbox .l.big{font-family:var(--font-d);font-size:22px;font-weight:800;color:#B9F26B;border-top:1px solid rgba(255,255,255,.2);padding-top:6px;margin-top:4px}
.totbox .l.sm{font-size:12.5px;opacity:.75}
.mbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;margin-top:10px}
.mbox div{background:var(--surface);border-radius:12px;padding:10px 6px;border:1px solid var(--line)}
.mbox b{font-family:var(--font-d);font-size:17px;display:block;font-variant-numeric:tabular-nums}
.mbox span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}

/* Checklist */
.ck-cat{font-size:11.5px;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px}
.ck{display:grid;grid-template-columns:minmax(0,1fr) 58px 150px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ck .lb{font-weight:700;overflow-wrap:anywhere}
.ck .lb small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.ck input.q{padding:7px;text-align:center}
.ck select{padding:8px 10px;font-weight:800;font-size:14px;border-width:2px}
.ck select.s-a_prevoir,.st-a_prevoir{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.ck select.s-prevu,.st-prevu{border-color:var(--sky);color:var(--sky);background:var(--sky-soft)}
.ck select.s-charge,.st-charge{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
.ck select.s-retour_ok,.st-retour_ok{border-color:var(--lime);color:var(--lime);background:var(--lime-soft)}
.ck select.s-abime,.st-abime{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.ck select.s-non_necessaire,.st-non_necessaire{border-color:var(--line);color:var(--muted);background:var(--surface-2)}
.ck select.s-a_confirmer{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.ck select.s-ok{border-color:var(--lime);color:var(--lime);background:var(--lime-soft)}
.ck select.s-na{border-color:var(--line);color:var(--muted);background:var(--surface-2)}
.ck .x{color:var(--muted);font-weight:800;padding:6px}
@media(max-width:560px){.ck{grid-template-columns:minmax(0,1fr) 54px auto}.ck select{grid-column:1/3}.ck .x{grid-row:2;grid-column:3}}
.ck.req{grid-template-columns:minmax(0,1fr) 150px}
@media(max-width:560px){.ck.req{grid-template-columns:minmax(0,1fr)}.ck.req select{grid-column:auto}}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

/* Équipe */
.need{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.need .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.need .h b{font-family:var(--font-d);font-size:16px;color:var(--navy)}
.asg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.asg .p{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-weight:800;font-size:13px}
.asg .p.ok{border-color:var(--lime);color:var(--lime)}
.asg .p button{width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-size:12px}
.asg .p.ok button.cf{background:var(--lime);color:#fff}

/* Planning */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h2{font-size:20px;color:var(--navy);flex:1;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-size:11px;font-weight:800;color:var(--muted);text-align:center;text-transform:uppercase;padding:2px 0}
.cal .d{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{opacity:.4}
.cal .d.today{border:2px solid var(--pink)}
.cal .d .n{font-size:12px;font-weight:800;color:var(--muted)}
.cal .ev{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff;background:var(--sky)}
.cal .ev.k-setup,.cal .ev.k-down{opacity:.65}
.cal .ev.c-lime{background:var(--lime)}.cal .ev.c-amber{background:var(--amber)}.cal .ev.c-violet{background:var(--violet)}.cal .ev.c-grey{background:var(--muted)}.cal .ev.c-red{background:var(--red)}
@media(max-width:560px){.cal .d{min-height:58px;padding:3px}.cal .ev{font-size:9.5px;padding:1px 3px}}

/* Modale */
#modal{position:fixed;inset:0;z-index:150;background:rgba(8,16,38,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:max(20px,env(safe-area-inset-top,0px))}
@media(min-width:700px){#modal{align-items:center;padding:20px}}
.mdl{background:var(--bg);width:100%;max-width:620px;max-height:calc(100% - 10px);overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:700px){.mdl{border-radius:22px;padding:20px 22px}}
.mdl.wide{max-width:900px}
.mdl-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mdl-h h2{font-size:20px;color:var(--navy);flex:1}
.mdl-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.mdl-f .btn{flex:1;min-width:130px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--head);color:#fff;padding:11px 20px;border-radius:30px;font-weight:800;font-size:14px;opacity:0;transition:.25s;z-index:300;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Aperçu PDF */
.paper-w{background:#8C97AD;border-radius:14px;padding:10px;overflow:hidden}
.paper-scale{transform-origin:top left}
.paper-scale .pd-page{margin-bottom:10px;box-shadow:0 4px 18px rgba(0,0,0,.25)}

/* ---------- DOCUMENT PDF (toujours papier blanc) ---------- */
#pdfHost{position:fixed;left:-12000px;top:0;width:794px}
.pd{font-family:var(--font-b);color:#1B2A4A;font-size:10pt;line-height:1.4;background:#fff}
.pd-page{width:794px;height:1122px;padding:44px 48px 52px;background:#fff;position:relative;overflow:hidden;color:#1B2A4A}
.pd-band{display:flex;align-items:center;gap:26px;border-bottom:3px solid #132A5C;padding-bottom:16px;margin-bottom:20px}
.pd-band img{height:96px;width:96px}
.pd-band.s{padding-bottom:10px;margin-bottom:16px}.pd-band.s img{height:58px;width:58px}
.pd-co{font-size:8.8pt;color:#5C6B8A;line-height:1.5}
.pd-co b{color:#132A5C;font-size:10.5pt}
.pd-doc{margin-left:auto;text-align:right}
.pd-doc .t{font-family:var(--font-d);font-size:20pt;font-weight:800;color:#E62E74;line-height:1}
.pd-doc .n{font-family:var(--font-d);font-size:13pt;font-weight:700;color:#132A5C;margin-top:4px}
.pd-doc .d{font-size:8.8pt;color:#5C6B8A;margin-top:3px}
.pd-2c{display:flex;gap:20px;margin-bottom:18px}
.pd-blk{flex:1;background:#F1F6FC;border-radius:10px;padding:13px 16px}
.pd-blk h4{font-family:var(--font-d);font-size:9pt;text-transform:uppercase;letter-spacing:.08em;color:#1F8FE0;margin-bottom:5px}
.pd-blk p{font-size:9.3pt;line-height:1.5}
.pd-blk b{color:#132A5C}
.pd-blk .tbd{color:#B97806;font-weight:700}
table.pd-t{width:100%;border-collapse:collapse;margin-bottom:14px}
table.pd-t th{background:#132A5C;color:#fff;font-size:8pt;text-transform:uppercase;letter-spacing:.04em;padding:8px 8px;text-align:left;font-weight:800}
table.pd-t th.r,table.pd-t td.r{text-align:right}
table.pd-t td{padding:8px 8px;border-bottom:1px solid #DCE6F2;font-size:9.2pt;vertical-align:top;font-variant-numeric:tabular-nums}
table.pd-t tr:nth-child(even) td{background:#F7FAFD}
table.pd-t .des b{color:#132A5C}
table.pd-t .des ul{margin:3px 0 0 14px;padding:0;color:#5C6B8A;font-size:8.3pt;line-height:1.45}
table.pd-t .des .rm{color:#E62E74;font-weight:700;font-size:8.5pt;margin-top:3px}
table.pd-t .off{color:#5FA318;font-weight:800}

.pd-totw{display:flex;justify-content:flex-end;margin-bottom:16px}
.pd-tot{width:300px}
.pd-tot .l{display:flex;justify-content:space-between;gap:10px;padding:5px 12px;font-size:9.6pt;font-variant-numeric:tabular-nums}
.pd-tot .l.rem{color:#E62E74;font-weight:700}
.pd-tot .l.ht{background:#F1F6FC;border-radius:8px;font-weight:800;color:#132A5C}
.pd-tot .l.ttc{background:#5FA318;color:#fff;font-weight:800;font-size:12.5pt;border-radius:8px;padding:9px 12px;margin-top:4px}
.pd-tot .l.note{font-size:8.3pt;color:#5C6B8A;font-style:italic;padding-top:2px}
.pd-h3{font-family:var(--font-d);font-size:11pt;font-weight:800;color:#132A5C;border-left:4px solid #E62E74;padding-left:10px;margin:16px 0 8px}
.pd-cond{font-size:8.5pt;color:#3d4d6e;line-height:1.55;margin:0;padding-left:16px}
.pd-cond li{margin:0 0 4px}
.pd-sign{display:flex;gap:20px;margin-top:18px}
.pd-sig{flex:1;border:1.5px solid #DCE6F2;border-radius:10px;padding:13px 16px;min-height:120px}
.pd-sig h4{font-family:var(--font-d);font-size:10pt;color:#132A5C;margin-bottom:6px}
.pd-sig p{font-size:8.5pt;color:#5C6B8A;line-height:2}
.pd-foot{position:absolute;bottom:22px;left:48px;right:48px;border-top:1px solid #DCE6F2;padding-top:8px;font-size:7.4pt;color:#8794AE;text-align:center;line-height:1.5}
.pd-cgl{font-size:7.3pt;color:#5C6B8A;line-height:1.5;white-space:pre-wrap;column-count:2;column-gap:20px}
.pd-paid{display:inline-block;border:3px solid #5FA318;color:#5FA318;font-family:var(--font-d);font-weight:800;font-size:16pt;padding:2px 14px;border-radius:8px;transform:rotate(-6deg)}
</style>
